<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GENERATION Y</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#fff;--card:#fff;--tx:#1d1f3a;--pr:#0b7a35;--pr2:#1fa855;--ac:#ffb300;--bd:#e3e6ea;--mu:#6b7280;--ok:#2e9e6b;--er:#d64545}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-radius:0 0 18px 18px;box-shadow:0 4px 14px rgba(63,61,158,.3)}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
main{max-width:820px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:4px 0 10px}
nav{position:fixed;bottom:10px;left:10px;right:10px;max-width:520px;margin:auto;display:flex;background:var(--card);border-radius:22px;box-shadow:0 6px 24px rgba(30,30,80,.18);z-index:5;padding:5px}
nav button{flex:1;padding:8px 2px;border:0;background:none;font:inherit;font-size:12px;color:var(--mu);cursor:pointer;border-radius:16px}
nav button span{display:block;font-size:20px}
nav button.on{background:var(--pr);color:#fff;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(30,30,80,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{border-radius:16px;padding:14px;color:#fff}.stat b{display:block;font-size:22px;margin-top:4px}.stat small{opacity:.9}
.s1{background:linear-gradient(135deg,#3f3d9e,#6a5acd)}.s2{background:linear-gradient(135deg,#00897b,#4db6ac)}.s3{background:linear-gradient(135deg,#f57c00,#ffb300)}.s4{background:linear-gradient(135deg,#c2185b,#ec6a9a)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus{outline:0;border-color:var(--pr2)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:10px 14px;border:1.5px solid var(--pr);background:#fff;color:var(--pr);border-radius:12px;font:inherit;cursor:pointer;margin:3px 3px 3px 0}
.btn.p{background:var(--pr);color:#fff}.btn.d{border-color:var(--er);color:var(--er)}.btn.s{padding:6px 10px;font-size:13px}
.ms{position:relative}.mdb{width:100%;text-align:left;padding:11px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;font:inherit;color:var(--tx);cursor:pointer}.mdp{position:absolute;left:0;right:0;z-index:10;background:#fff;border:1.5px solid var(--bd);border-radius:12px;max-height:250px;overflow:auto;box-shadow:0 8px 22px rgba(30,30,80,.2);margin-top:4px}.mo{display:flex;align-items:center;gap:10px;padding:11px 14px;margin:0;color:var(--tx);font-size:15px;border-bottom:1px solid var(--bd);cursor:pointer}.mo input{width:auto}.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:1.5px solid var(--bd);border-radius:18px;cursor:pointer;user-select:none;font-size:14px;background:#fff}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.hint{font-size:13px;color:var(--mu);margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left}th{background:#ecebfa;color:var(--pr)}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--bd);gap:8px}
.item:last-child{border:0}.clk{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:#ecebfa;color:var(--pr);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tag{font-size:12px;padding:2px 9px;border-radius:10px;background:#d7f3e4;color:var(--ok)}.tag.c{background:#fde0e0;color:var(--er)}
.ov{position:fixed;inset:0;background:rgba(20,20,50,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.md{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:700px}
.dr{position:fixed;top:0;bottom:0;left:0;width:280px;max-width:84%;background:var(--card);z-index:30;transform:translateX(-105%);transition:.25s;box-shadow:6px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column}
.dr.on{transform:none}.scr{position:fixed;inset:0;background:rgba(20,20,50,.5);z-index:25;display:none}.scr.on{display:block}
.dh{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:26px 18px}.dh b{font-size:18px;display:block}
.dr a{display:block;padding:14px 18px;color:var(--tx);cursor:pointer;border-bottom:1px solid var(--bd)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#262846;color:#fff;padding:10px 16px;border-radius:20px;z-index:50;font-size:14px}
#rp{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#000;padding:24px;font-family:'Noto Sans Bengali',sans-serif}
#rp h3{margin:0 0 6px}#rp p{margin:2px 0;font-size:14px;white-space:pre-line}#rp th{background:#ecebfa;color:#000}
.lg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
@media print{body>*:not(#rp){display:none!important}#rp{position:static;width:auto}}
header{background:#0b7a35!important;border-radius:0!important;box-shadow:none!important;position:static!important;justify-content:center;padding:20px 14px 34px!important}
header img{width:62px;height:62px;border-radius:50%;background:#fff}
header h1{flex:none!important;font-size:24px!important;letter-spacing:1px;text-transform:uppercase}
main{max-width:640px!important}
.full{margin:-14px -14px 0}
.wb{background:#1fa855;border-radius:22px 22px 0 0;margin-top:-20px;padding:16px 18px 30px;display:flex;align-items:center;gap:12px;color:#fff;position:relative}
.wb img{width:46px;height:46px;border-radius:50%;background:#fff}.wb b{flex:1;font-size:26px;font-weight:400}.wb small{display:block;font-size:13px;opacity:.9}
.dots{background:none;border:0;color:#fff;font-size:28px;cursor:pointer;padding:0 6px}
.sheet{background:#fff;border-radius:24px 24px 0 0;margin-top:-18px;padding:18px 14px;position:relative}
.gg{display:grid;grid-template-columns:repeat(3,1fr);margin:22px 0 14px}
.gi{text-align:center;padding:14px 4px;cursor:pointer;position:relative;font-size:15px}
.gi:not(:nth-child(3n)):after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:1px;background:#dde1e6}
.gi img{width:54px;height:54px;object-fit:contain;display:block;margin:0 auto 8px}
nav{left:0!important;right:0!important;bottom:0!important;max-width:none!important;border-radius:0!important;background:#f4f5fa!important;padding:6px 0 8px!important;box-shadow:0 -2px 10px rgba(0,0,0,.08)!important}
nav button{border-radius:0!important;background:none!important;color:#6b7280!important;font-size:11px!important}
nav button.on{color:#1fa855!important;font-weight:600}
nav button svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.7;display:block;margin:0 auto 2px}
nav button.on svg{fill:currentColor;fill-opacity:.18}
body{padding-bottom:74px!important}
.ov.bs{align-items:flex-end;padding:0}.ov.bs .md{border-radius:22px 22px 0 0;background:#fff;max-width:640px}
.rx{font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;font-size:15px;white-space:pre-wrap;margin:0 0 12px;max-height:46vh;overflow:auto;line-height:1.45}
th,td{padding:7px 6px!important;font-size:13px}td,th{white-space:nowrap}
.fr{background:#fff;color:#000;font-family:'Noto Sans Bengali',Arial,sans-serif;padding:6px}
.fr .ft{text-align:center;position:relative;margin-bottom:8px}.fr .ft img{position:absolute;left:4px;top:0;width:64px;border-radius:50%}
.fr .fh{font-size:26px;font-weight:700}.fr .fl{font-weight:700;font-size:18px;margin-top:12px}
.fr .fm{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:700;gap:10px}
.fr .red{color:#b71c1c;font-size:12px}.fr .tb{background:#ffff00;padding:4px 14px;font-size:20px}
.fr table{border-collapse:collapse;width:max-content;min-width:100%}
.fr th,.fr td{border:1px solid #444;padding:2px 7px!important;text-align:center;white-space:nowrap;font-size:12px}
.fr th{background:#c6e0b4;color:#000}.fr .sn td{font-weight:700}.fr .pb td{background:#ffd966;font-weight:700}
.fr td.yr,.fr td.yt{font-weight:700;font-size:18px}.fr td.mo{text-align:right}.fr .ya{background:#e2efda}.fr .yb2{background:#fff2cc}
</style></head><body>

const loc=x=>{let d=String(x||'').replace(/[^\d+]/g,'');if(d.startsWith('+880'))d='0'+d.slice(4);else if(d.startsWith('880'))d='0'+d.slice(3);return d};
const qp=x=>{try{const b=[];x.replace(/=([0-9A-F]{2})|([^=])/gi,(m,h,ch)=>{if(h)b.push(parseInt(h,16));else b.push(...new TextEncoder().encode(ch));return ''});return new TextDecoder().decode(new Uint8Array(b))}catch(e){return x}};
function parseVcf(txt){txt=txt.replace(/=\r?\n/g,'').replace(/\r?\n[ \t]/g,'');const out=[];
 txt.split(/BEGIN:VCARD/i).slice(1).forEach(c=>{let name='';const tels=[];
  c.split(/\r?\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).toUpperCase(),pn=k.split(';')[0].replace(/^.*\./,''),v=l.slice(i+1).trim(),d=/QUOTED-PRINTABLE/.test(k)?qp(v):v;
   if(pn==='FN')name=d;else if(pn==='N'&&!name)name=d.split(';').filter(Boolean).reverse().join(' ').trim();else if(pn==='TEL')tels.push(loc(v))});
  tels.filter(Boolean).forEach(x=>out.push({n:name||x,t:x}))});return out}

 <label class="btn" style="display:inline-block">📥 Import .vcf<input type="file" id="cv" accept=".vcf,text/vcard,text/x-vcard,text/directory,text/plain" hidden></label><button class="btn" id="cc">${t('Close')}</button>`,1);
 const draw=()=>{const q=$('#cq',o).value.toLowerCase(),L=(db.contacts||[]).filter(c=>(c.n+' '+c.t).toLowerCase().includes(q)).slice(0,60);
  $('#cl2',o).innerHTML=L.map((c,i)=>`<div class="item clk" data-i="${i}"><div><b>${esc(c.n)}</b><div class="hint">${esc(c.t)}</div></div></div>`).join('')||`<div class="hint">${t('No contacts imported yet')}</div>`;
  $$('.item',$('#cl2',o)).forEach(el=>el.onclick=()=>{const c=L[+el.dataset.i];o.close();cb(c)})};
 $('#cq',o).oninput=draw;draw();
 $('#cv',o).onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{const mp={};[...(db.contacts||[]),...parseVcf(x)].forEach(c=>mp[c.t]=c);db.contacts=Object.values(mp).sort((a,b)=>a.n.localeCompare(b.n));save();draw();toast(db.contacts.length+' contacts')})};
 $('#cc',o).onclick=o.close}

   $('#rh').innerHTML=allReceipts().filter(r=>!m||r.mid===m.id).slice(0,m?100:30).map(r=>{const mm=db.members.find(x=>x.id===r.mid);return `<div class="item clk" onclick="showRec(${r.id})"><div><b>${r.no?'#'+String(r.no).padStart(4,'0')+' ':''}${esc(mm?mm.name:'—')}</b><div class="hint">${[...r.rows].sort((a,b)=>a[1]-b[1]||a[0]-b[0]).map(x=>mn(x[0])+' '+x[1]).join(', ')} • ${new Date(r.ts).toLocaleDateString()}</div></div><b>${money(r.tot)} ৳</b></div>`}).join('')||'<div class="hint">—</div>';
   $('#cb').style.display=m?'block':'none';
   if(m){MF=$('#mf').value;MT=$('#mt').value;const r=receiptRep(m,MF,MT);$('#rv').innerHTML=`<div class="card"><b>${esc(r.title)}</b>${tbl(r)}<div style="margin-top:8px">${acts(()=>receiptRep(m,MF,MT))}</div></div>`}};
  $('#rmb').oninput=$('#mf').onchange=$('#mt').onchange=draw;draw()}
 if(tab==='rep'){if(!RINIT){RINIT=1;RF=`${firstYear()}-01`;RT=`${CY}-12`}app.innerHTML=`<h2>${t('Report')}</h2><label>${t('Report Type')}</label><select id="rtp"><option value="3" ${RK==='3'?'selected':''}>${t('Full Report')}</option><option value="0" ${RK==='0'?'selected':''}>${t('Collection Report')}</option><option value="1" ${RK==='1'?'selected':''}>${t('Month-wise Summary')}</option><option value="2" ${RK==='2'?'selected':''}>${t('All Members')}</option></select>
  <div class="row"><div><label>${t('From Month')}</label><input type="month" id="rf" value="${RF}"></div><div><label>${t('To Month')}</label><input type="month" id="rt" value="${RT}"></div></div><div class="card" id="rc" style="margin-top:12px"></div>`;
  const get=()=>{RF=$('#rf').value;RT=$('#rt').value;const k=+$('#rtp').value;return k==3?fullRep(RF,RT):k==0?periodRep(RF,RT):k==1?monthsRep(RF,RT):allRep(RF,RT)};
  const show=()=>{reg.length=0;const r=get();$('#rc').innerHTML=(r.html?`<div style="overflow:auto">${r.html}</div>`:`<b>${esc(r.title)}</b><div class="hint">${esc(r.lines.join(' • '))}</div>${tbl(r)}`)+`<div style="margin-top:8px">${acts(get)}</div>`};
  $('#rtp').onchange=()=>{RK=$('#rtp').value;if(RK==='3'){$('#rf').value=`${firstYear()}-01`;$('#rt').value=`${CY}-12`}show()};$('#rf').onchange=$('#rt').onchange=show;show()}
 if(tab==='mm'){app.innerHTML=`<h2>${isAdmin()?t('Member Management'):t('Member Profile')}</h2>${isAdmin()?`<button class="btn p" onclick="memberForm()">➕ ${t('Add Member')}</button>`:''}<input id="q" placeholder="🔍 ${t('Search member')}" style="margin:8px 0"><div class="card" id="ml"></div>`;$('#q').oninput=()=>memList(isAdmin());memList(isAdmin())}
 if(tab==='us'){app.innerHTML=`<h2>${t('Admin & Users')}</h2><button class="btn p" onclick="userForm()">➕ ${t('Add User')}</button><div class="card" style="margin-top:8px">${db.users.map(u=>`<div class="item"><div class="av">${esc(u.name[0])}</div><div style="flex:1"><b>${esc(u.name)}</b><div class="hint">${t(u.role==='admin'?'Admin':'User')}</div></div><button class="btn s" onclick="userForm(${u.id})">🔑</button><button class="btn s d" onclick="delUser(${u.id})">🗑</button></div>`).join('')}</div>`}
 if(tab==='st'){const sc=`<div class="card">${isAdmin()?`<button class="btn" onclick="go('mm')">👥 ${t('Member Management')}</button><button class="btn" onclick="go('us')">🛡 ${t('Admin & Users')}</button>`:''}<button class="btn" onclick="toggleLang()">🌐 ${t('Language')}: ${lang=='en'?'বাংলা':'English'}</button><button class="btn d" onclick="logout()">⎋ ${t('Logout')}</button></div>`;
  if(!isAdmin()){app.innerHTML=`<h2>${t('Settings')}</h2>${sc}`;return}
  app.innerHTML=`<h2>${t('Settings')}</h2>${sc}<div class="card"><label>${t('Organization Name')}</label><input id="so" value="${esc(db.settings.org)}"> <label>Tagline (use | for new line)</label><input id="sg" value="${esc(db.settings.tag)}"><label>${t('Address')}</label><input id="sa" value="${esc(db.settings.addr)}"><label>${t('Phone')}</label><input id="sh" type="tel" value="${esc(db.settings.phone)}"><label>${t('Thank-you message')}</label><input id="sk" value="${esc(db.settings.thanks)}">
  <label>${t('Per Share Value')} (৳)</label><input id="sp" type="number" min="1" value="${price()}"><div class="hint">${t('Share changes apply to new entries only')}</div>
  <button class="btn p" id="ss" style="margin-top:12px">${t('Save')}</button></div>
  <div class="card"><label>${t('Sheet URL')}</label><input id="su" value="${esc(db.sheet)}"><div style="margin-top:10px"><button class="btn p" id="sy">☁ ${t('Sync')}</button><button class="btn" id="bk">${t('Backup')}</button><label class="btn" style="display:inline-block">${t('Restore')}<input type="file" id="rs" accept=".json" hidden></label></div></div>`;
  $('#ss').onclick=()=>{db.settings.org=$('#so').value.trim()||'Co-operative Society';db.settings.addr=$('#sa').value.trim();db.settings.tag=$('#sg').value.trim();db.settings.phone=$('#sh').value.trim();db.settings.thanks=$('#sk').value.trim();db.settings.price=Math.max(1,+$('#sp').value||1000);save();render();toast(t('Saved'))};
  $('#sy').onclick=async()=>{db.sheet=$('#su').value.trim();save();if(!db.sheet)return;try{await fetch(db.sheet,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({members:db.members,entries:db.entries})});toast(t('Sync')+' ✔')}catch(e){toast('Error: '+e.message)}};
  $('#bk').onclick=()=>dl(new Blob([JSON.stringify(db)],{type:'application/json'}),'coop_backup_'+today+'.json');
  $('#rs').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(s=>{try{const d=JSON.parse(s);if(!d.members||!d.entries)throw 0;db=Object.assign(db,d);save();render();toast(t('Saved'))}catch(x){toast('Invalid file')}})}}
}
function openDr(){$('#dr').classList.add('on');$('#scr').classList.add('on')}
function toggleLang(){lang=lang==='en'?'bn':'en';try{localStorage.setItem('lang',lang)}catch(e){}render()}
$('#scr').onclick=()=>{$('#dr').classList.remove('on');$('#scr').classList.remove('on')};
render();
</script></body></html>
